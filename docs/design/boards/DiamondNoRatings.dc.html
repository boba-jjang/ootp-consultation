<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Defensive alignment without ratings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0A1118}
*,*::before,*::after{box-sizing:border-box}
a{color:#F5F7FA}a:hover{color:#E5A93C}
button{font:inherit}
:focus-visible{outline:2px solid #E5A93C;outline-offset:2px}
</style>
</helmet>
<div style="width: 620px; height: 580px; padding: 20px; background: #0A1118; color: #F5F7FA; font-family: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<section aria-labelledby="align-title" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; background: #121D24; border: 1px solid rgba(245,247,250,0.08); border-radius: 6px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px">
<h2 id="align-title" style="margin: 0; font-size: 17px; font-weight: 600">Defensive alignment</h2>
<p style="margin: 0; font-size: 13px; color: #9AA7B4">Listed positions until ratings arrive</p>
</div>
<div style="position: relative; width: 100%; aspect-ratio: 800 / 640">
<svg viewBox="0 0 800 640" aria-hidden="true" focusable="false" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; opacity: 0.4">
<path d="M400 600 L40 240 A424 424 0 0 1 760 240 Z" style="fill: #13282D"></path>
<path d="M40 240 A424 424 0 0 1 760 240" style="fill: none; stroke: #2B241B; stroke-width: 16"></path>
<path d="M400 600 L170 370 A242 242 0 0 1 630 370 Z" style="fill: #2B241B"></path>
<path d="M400 307 L530 437 L400 567 L270 437 Z" style="fill: #13282D"></path>
<circle cx="400" cy="445" r="20" style="fill: #2B241B"></circle>
<rect x="391" y="443" width="18" height="4" style="fill: #F5F7FA; opacity: 0.75"></rect>
<circle cx="400" cy="594" r="34" style="fill: #2B241B"></circle>
<path d="M40 240 L400 600 L760 240" style="fill: none; stroke: rgba(245,247,250,0.55); stroke-width: 2"></path>
<path d="M563 429 L571 437 L563 445 L555 437 Z" style="fill: #F5F7FA"></path>
<path d="M400 267 L408 275 L400 283 L392 275 Z" style="fill: #F5F7FA"></path>
<path d="M237 429 L245 437 L237 445 L229 437 Z" style="fill: #F5F7FA"></path>
<path d="M391 593 L409 593 L409 600 L400 607 L391 600 Z" style="fill: #F5F7FA"></path>
</svg>
<sc-for list="{{field}}" as="f" hint-placeholder-count="9">
<button type="button" style="position: absolute; left: {{f.x}}%; top: {{f.y}}%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 104px; min-height: 44px; padding: 5px 10px; background: rgba(10,17,24,0.92); color: #F5F7FA; border: 1px solid rgba(245,247,250,0.20); border-radius: 4px; cursor: pointer">
<span style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; color: #E5A93C">{{f.pos}}</span><span style="font-size: 14px; font-weight: 600; line-height: 1.2">{{f.name}}</span></span>
<span style="white-space: nowrap; font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; line-height: 1.3; color: #9AA7B4">{{f.stat}}</span>
</button>
</sc-for>
<button type="button" style="position: absolute; left: 50%; top: 27%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 124px; min-height: 44px; padding: 5px 10px; background: rgba(10,17,24,0.92); color: #F5F7FA; border: 1px dashed rgba(229,169,60,0.85); border-radius: 4px; cursor: pointer">
<span style="display: flex; align-items: baseline; gap: 6px; white-space: nowrap"><span style="font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; color: #E5A93C">CF</span><span style="font-size: 14px; font-weight: 600; line-height: 1.2">No one listed</span></span>
<span style="white-space: nowrap; font-size: 12px; line-height: 1.3; color: #E5A93C">Assign a player</span>
</button>
<div style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: rgba(10,17,24,0.95); border: 1px solid rgba(229,169,60,0.55); border-radius: 4px">
<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" style="flex: none"><path d="M12 3 L22 20 L2 20 Z M12 10 L12 14 M12 17 L12 17.2" style="fill: none; stroke: #E5A93C; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
<p style="flex: 1; margin: 0; font-size: 13px; line-height: 1.45; color: #C9D2DB"><span style="display: block; font-size: 14px; font-weight: 600; color: #F5F7FA">Defensive ratings missing</span>Positions follow each player's listed spot, and the batting order is built from hitting alone.</p>
<a href="Clubhouse.dc.html" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border: 1px solid rgba(229,169,60,0.55); border-radius: 4px; font-size: 14px; font-weight: 600; color: #E5A93C; text-decoration: none">Upload ratings</a>
</div>
</div>
</section>
</div>
</x-dc>

    return {
      field: [
        { pos: 'LF', name: 'Yamanaka', stat: 'xwOBA .405', x: 20, y: 40 },

        { pos: 'SS', name: 'Mangjeol', stat: 'xwOBA .174', x: 38, y: 53 },
        { pos: '2B', name: 'Choi', stat: 'xwOBA .317', x: 62, y: 53 },
        { pos: '3B', name: 'Kawasaki', stat: 'xwOBA .415', x: 30, y: 67 },
        { pos: '1B', name: 'Eng', stat: 'xwOBA .347', x: 70, y: 67 },
        { pos: 'P', name: 'Niu', stat: '10.0 K/9', x: 50, y: 79 },
        { pos: 'C', name: 'Tsumoto', stat: 'xwOBA .342', x: 50, y: 92.5 },
        { pos: 'DH', name: 'Shinn', stat: 'xwOBA .470', x: 11, y: 92.5 }
      ]
    };
  }
}
</script>
</body>
</html>
